# Local development only. Synthetic credentials; PostgreSQL bound to localhost.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eversoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eversoft_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-eversoft}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - eversoft_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-eversoft} -d ${POSTGRES_DB:-eversoft}']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eversoft_pg_data:
